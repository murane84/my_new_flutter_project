# ======================================================
# 🔑 FORCE JDK 17 (PROJECT ONLY)
# ======================================================
org.gradle.java.home=C:\\jdk-17

# ======================================================
# 🚀 GRADLE PERFORMANCE (HIGH IMPACT)
# ======================================================
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.workers.max=8

# JVM tuning (safe & fast for Java 17)
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:+UseParallelGC -Dfile.encoding=UTF-8

# ======================================================
# 📦 ANDROIDX / DEPENDENCIES
# ======================================================
android.useAndroidX=true
android.enableJetifier=false

# ======================================================
# 🔕 DISABLE EXPENSIVE / BROKEN TASKS
# ======================================================
android.experimental.disableLintModelForUnitTests=true
android.enableUnitTestBinaryResources=false
android.enableTestFixtures=false

# Disable configuration cache (prevents stale C:/D: paths)
org.gradle.unsafe.configuration-cache=false

# ======================================================
# 🚀 R8
# ======================================================
android.enableR8.fullMode=true

# ======================================================
# 🌐 NETWORK
# ======================================================
systemProp.https.protocols=TLSv1.2,TLSv1.3
# Force Gradle to use HTTP/1.1 instead of HTTP/2
systemProp.http.keepAlive=false
systemProp.http.version=HTTP/1.1
