# A generic, single database configuration.

[alembic]
# Path to migration scripts
script_location = alembic

# Prepend current working directory to sys.path
prepend_sys_path = .

# Use OS separator for version paths
version_path_separator = os

# SQLAlchemy database URL (corrected encoding)
sqlalchemy.url = postgresql://postgres:%%40%%21%%40Ladybug%%40%%211994@localhost:5432/my_aluta_db

[post_write_hooks]
# (optional post-generation format hooks can be added here)

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
