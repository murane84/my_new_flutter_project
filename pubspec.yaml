name: aluta
description: "Music & Chat App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Core
  cupertino_icons: ^1.0.8
  provider: ^6.1.1

  # Networking
  http: ^1.5.0
  web_socket_channel: ^3.0.3

  # Storage & Security
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.3.2

  # Auth
  email_validator: ^3.0.0

  # Audio
  just_audio: ^0.10.5
  just_audio_windows: ^0.2.0
  audioplayers: ^6.5.0
  on_audio_query: ^2.9.0
  audio_service: ^0.18.14
  audio_session: ^0.2.2

  # File / Platform
  file_picker: ^12.0.0-beta.5
  permission_handler: ^13.0.0
  path_provider: ^2.1.2
  platform: ^3.1.6
  connectivity_plus: ^7.0.0
  device_info_plus: ^13.1.0

  # Utilities
  logger: ^2.6.1
  intl: ^0.20.2
  timeago: ^3.6.0
  url_launcher: ^6.2.6
  share_plus: ^13.1.0
  cached_network_image: ^3.4.1

  # UI / UX
  emoji_picker_flutter: ^4.3.0
  shimmer: ^3.0.0
  animations: ^2.0.11
  lottie: ^3.1.2
  animated_text_kit: ^4.2.2
  flutter_spinkit: ^5.1.0
  liquid_pull_to_refresh: ^3.0.1
  infinite_scroll_pagination: ^5.1.1
  flutter_slidable: ^4.0.3
  badges: ^3.0.2
  percent_indicator: ^4.2.2
  marquee: ^2.0.0
  smooth_page_indicator: ^2.0.1

  # Notifications
  flutter_local_notifications: ^22.2.0

# Force the Android permission implementation to 13.0.0 (compileSdk 35).
# The newer 14.0.0 requires compileSdk 37 (a preview SDK we don't have), so
# we cap it here — 13.0.0 builds cleanly against the installed SDK 36.
dependency_overrides:
  permission_handler_android: 13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.5

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_foreground: "assets/images/logo.png"
  adaptive_icon_background: "#C62828"
  windows:
    generate: true
    image_path: "assets/images/logo.png"
    icon_size: 48

flutter_native_splash:
  image: "assets/images/splash.png"
  color: "#000000"
  android: true
  ios: true
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/images/auth_background.jpg
